# Google One 脚本版
# QUIC 阻断 + one.google.com 响应改写；脚本在仓库 g1.js
# Apple 域名走 PROXY；首页要选土耳其节点

[Rule]
AND,((PROTOCOL,UDP),(DEST-PORT,443)),REJECT-NO-DROP
DOMAIN-SUFFIX,apple.com,PROXY
DOMAIN-SUFFIX,itunes.com,PROXY
DOMAIN-SUFFIX,mzstatic.com,PROXY
DOMAIN-SUFFIX,cdn-apple.com,PROXY
DOMAIN-SUFFIX,google.com,PROXY
DOMAIN-SUFFIX,googleapis.com,PROXY
DOMAIN-SUFFIX,gstatic.com,PROXY
DOMAIN-SUFFIX,googleusercontent.com,PROXY
FINAL,DIRECT

[Script]
g1 = type=http-response,pattern=^https:\/\/one\.google\.com\/,requires-body=1,max-size=0,script-path=https://cdn.jsdelivr.net/gh/521ox/shadowrocket-google-one@85834ef25eca7c2b0617894d50f3b2b6e0e34c04/g1.js

[MITM]
enable = true
hostname = one.google.com, payments.google.com, play.googleapis.com