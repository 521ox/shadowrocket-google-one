# Google One 基本配置
# 两条正文重写 + one.google.com 的 HTTPS 解密
# 用法：首页选一个节点 -> 全局路由选「配置」-> 对本配置开启 HTTPS 解密

[Rule]
DOMAIN-SUFFIX,google.com,PROXY
DOMAIN-SUFFIX,googleapis.com,PROXY
DOMAIN-SUFFIX,gstatic.com,PROXY
DOMAIN-SUFFIX,googleusercontent.com,PROXY
FINAL,DIRECT

[Body Rewrite]
http-response ^https://one.google.com/ai\?.*$ 30tb\.ai\.pro\.m 30tb.m
http-response ^https://one.google.com/ai\?.*$ 20tb\.m\.v2 20tb.m

[MITM]
enable = true
hostname = one.google.com