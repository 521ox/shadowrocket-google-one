# Google One 独立配置
# 目标：土区 30TB 旧价 2949.99 TRY（公开历史记录，实际以 App Store 面板为准）
# 仅用于 one.google.com/ai 的 HTTPS 解密与响应体重写，不含去广告等规则。
# 使用方法：首页选一个节点 -> 全局路由选「配置」-> 对本配置开启 HTTPS 解密。

[General]
# Google 走 QUIC 时日志只显示 UDP，且无法 MITM；阻断后回落到 TCP/TLS
block-quic = all-proxy

[Rule]
DOMAIN-SUFFIX,google.com,PROXY
DOMAIN-SUFFIX,googleapis.com,PROXY
DOMAIN-SUFFIX,gstatic.com,PROXY
DOMAIN-SUFFIX,googleusercontent.com,PROXY
FINAL,DIRECT

[Body Rewrite]
http-response ^https://one.google.com/ai\?.*$ com\.google\.gemini\.30tb\.ai\.pro\.m g1.ios.30tb.m
http-response ^https://one.google.com/ai\?.*$ 30tb\.ai\.pro\.m 30tb.m
http-response ^https://one.google.com/ai\?.*$ 20tb\.m\.v2 20tb.m

[MITM]
hostname = one.google.com